<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="Flujo de trabajo profesional en Git y GitHub con ramas y commits semánticos">
  <rect width="800" height="500" fill="#0A0D14"/>
  <!-- Retícula de fondo -->
  <g stroke="#151C2A" stroke-width="1">
    <line x1="0" y1="70" x2="800" y2="70"/>
    <line x1="0" y1="250" x2="800" y2="250"/>
    <line x1="0" y1="430" x2="800" y2="430"/>
    <line x1="140" y1="0" x2="140" y2="500"/>
    <line x1="420" y1="0" x2="420" y2="500"/>
    <line x1="700" y1="0" x2="700" y2="500"/>
  </g>

  <!-- Ventana de consola de control de versiones -->
  <rect x="44" y="38" width="712" height="424" rx="12" fill="#0F141F" stroke="#253246" stroke-width="1.5"/>

  <!-- Barra superior -->
  <rect x="44" y="38" width="712" height="42" rx="12" fill="#151D2C"/>
  <circle cx="68" cy="59" r="6" fill="#EF4444"/>
  <circle cx="88" cy="59" r="6" fill="#F59E0B"/>
  <circle cx="108" cy="59" r="6" fill="#34D399"/>
  <text x="134" y="64" fill="#94A3B8" font-family="'JetBrains Mono', Consolas, monospace" font-size="12">github.com/GianniF97/ferrari-git-github-pp — git branch --all</text>

  <!-- Encabezado interior -->
  <rect x="74" y="104" width="280" height="28" rx="5" fill="#102A20" stroke="#34D399"/>
  <text x="88" y="123" fill="#34D399" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" font-weight="bold">GITFLOW &amp; CONTROL DE VERSIONES</text>

  <text x="74" y="162" fill="#F2F4F8" font-family="'Space Grotesk', system-ui, sans-serif" font-size="20" font-weight="bold">Flujos de Trabajo, Ramas y Commits Semánticos</text>
  <text x="74" y="186" fill="#94A3B8" font-family="'Inter', system-ui, sans-serif" font-size="13">Práctica Profesional de Sistemas: Convenciones de colaboración e integración continua</text>

  <!-- Diagrama de Git Graph -->
  <g transform="translate(74, 215)">
    <!-- Rama main -->
    <line x1="40" y1="40" x2="610" y2="40" stroke="#34D399" stroke-width="3"/>
    <text x="0" y="44" fill="#34D399" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" font-weight="bold">main</text>
    <circle cx="90" cy="40" r="8" fill="#0A0D14" stroke="#34D399" stroke-width="3"/>
    <circle cx="230" cy="40" r="8" fill="#0A0D14" stroke="#34D399" stroke-width="3"/>
    <circle cx="430" cy="40" r="8" fill="#0A0D14" stroke="#34D399" stroke-width="3"/>
    <circle cx="580" cy="40" r="8" fill="#34D399"/>

    <!-- Rama develop -->
    <line x1="90" y1="40" x2="150" y2="100" stroke="#60A5FA" stroke-width="2.5" stroke-dasharray="4 2"/>
    <line x1="150" y1="100" x2="520" y2="100" stroke="#60A5FA" stroke-width="2.5"/>
    <line x1="520" y1="100" x2="580" y2="40" stroke="#60A5FA" stroke-width="2.5" stroke-dasharray="4 2"/>
    <text x="-15" y="104" fill="#60A5FA" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" font-weight="bold">develop</text>
    <circle cx="150" cy="100" r="7" fill="#0A0D14" stroke="#60A5FA" stroke-width="2.5"/>
    <circle cx="280" cy="100" r="7" fill="#0A0D14" stroke="#60A5FA" stroke-width="2.5"/>
    <circle cx="520" cy="100" r="7" fill="#60A5FA"/>

    <!-- Rama feature -->
    <line x1="150" y1="100" x2="200" y2="160" stroke="#FBBF24" stroke-width="2"/>
    <line x1="200" y1="160" x2="350" y2="160" stroke="#FBBF24" stroke-width="2"/>
    <line x1="350" y1="160" x2="400" y2="100" stroke="#FBBF24" stroke-width="2"/>
    <text x="-15" y="164" fill="#FBBF24" font-family="'JetBrains Mono', Consolas, monospace" font-size="11">feature/*</text>
    <circle cx="200" cy="160" r="6" fill="#0A0D14" stroke="#FBBF24" stroke-width="2"/>
    <circle cx="270" cy="160" r="6" fill="#0A0D14" stroke="#FBBF24" stroke-width="2"/>
    <circle cx="350" cy="160" r="6" fill="#FBBF24"/>

    <!-- Etiquetas de commits semánticos -->
    <rect x="75" y="5" width="115" height="22" rx="4" fill="#13231B" stroke="#255E44"/>
    <text x="82" y="20" fill="#34D399" font-family="'JetBrains Mono', Consolas, monospace" font-size="10">chore(release): v1.0</text>

    <rect x="220" y="176" width="130" height="22" rx="4" fill="#241E11" stroke="#6B4D16"/>
    <text x="227" y="191" fill="#FBBF24" font-family="'JetBrains Mono', Consolas, monospace" font-size="10">feat(auth): login flow</text>

    <rect x="360" y="65" width="125" height="22" rx="4" fill="#131F33" stroke="#26487A"/>
    <text x="367" y="80" fill="#60A5FA" font-family="'JetBrains Mono', Consolas, monospace" font-size="10">merge PR #4 into dev</text>

    <rect x="510" y="5" width="115" height="22" rx="4" fill="#13231B" stroke="#255E44"/>
    <text x="517" y="20" fill="#34D399" font-family="'JetBrains Mono', Consolas, monospace" font-size="10">chore(release): v1.1</text>
  </g>
</svg>
